<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Pixelbleed</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="../images/logoPixelbleed01.3.png">
    <script type="module" src="app.js"></script>
</head>

<body>
    <header> <!-- Navigation -->
        <div class="header-left">
            <h1 class="app-title"><img src="../images/logoPixelbleed01.3.png" height="30"/> Pixelbleed</h1>
        </div>
    </header>

    <main>
        <section class="section-settings"> <!-- Settings -->
            <div class="setting">
                <h1>Canvas size</h1>
                <div>
                    <input type="number" id="setting-width" min="0" value="16" />
                    px × 
                    <input type="number" id="setting-height" min="0" value="16" />
                    px
                </div>
            </div>

            <div class="setting">
                <h1>Grid</h1>
                <div class="field-row">
                    <input type="checkbox" id="setting-gridlines" />
                    <label for="setting-gridlines">Show gridlines</label>
                </div>
            </div>

            <div class="setting">
                <h1>Corner style</h1>
                <div class="field-row">
                    <h2>Size</h2>
                    <div>
                        <input type="number" id="setting-corner-size" min="0" max="50" value="25" />
                        % of the pixel
                    </div>
                </div>
                <div class="field-row">
                    <h2>Shape</h2>
                    <select name="setting-corner-shape" id="setting-corner-shape">
                        <option value="circle">Circle</option>
                        <option value="bezel">Bezel</option>
                    </select>
                </div>
            </div>

            <div class="setting">
                <h1>Fill colour</h1>
                <input type="color" id="setting-colour" />
            </div>

            <div class="setting">
                <h1>Padding</h1>
                <div class="field-row">
                    <label for="padding-top">Top</label>
                    <input type="number" id="padding-top" min="0" value="0" />
                </div>
                <div class="field-row">
                    <label for="padding-bottom">Bottom</label>
                    <input type="number" id="padding-bottom" min="0" value="0" />
                </div>
                <div class="field-row">
                    <label for="padding-left">Left</label>
                    <input type="number" id="padding-left" min="0" value="0" />
                </div>
                <div class="field-row">
                    <label for="padding-right">Right</label>
                    <input type="number" id="padding-right" min="0" value="0" />
                </div>
            </div>
            <button id="save-settings">Save</button>
        </section>

        <section class="section-canvas"> <!-- Main content -->
            <div id="canvas">

            </div>
        </section>

        <section class="section-saving"> <!-- Saving --> 
            <div class="saving">
                <h1>Size</h1>
                <div>
                    Render image with width 
                    <input type="number" id="saving-width" />
                    px (and height &lt;height&gt; px)
                </div>
            </div>
            <div class="saving">
                <div>
                    <button id="saving-svg">Save as <code>svg</code>...</button>
                    <button id="saving-png">Save as <code>png</code>...</button>
                </div>
                <div>
                    <button id="saving-pixelbleed">Save as <tt>pxbld</tt>...</button>
                </div>
            </div>
        </section>
    </main>

    <footer> <!-- Status bar -->
        <div>This piece of software has been made to create the assets for <a href="https://github.com/stetai/stedule/" title="Stedule">Stedule</a>.</div>

    </footer>
</body>

</html>
